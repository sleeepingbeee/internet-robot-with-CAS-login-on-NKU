          \ 代码节点通常 30s 上限\nCRAWL_MAX_PAGES = 15           # 最多翻几个列表页（每页 10 条，每条都要再请求详情页）\n\
          CRAWL_DELAY = 0.0             # 详情页之间的间隔（秒），0 表示不等待\nCRAWL_ONLY_FUTURE =\
          \ True      # 只保留开始时间在未来的活动\nMAX_RETRIES = 3               # 只对 GET 生效；登录\
          \ POST 绝不重试\n\nBASE_URL = \"https://zyfw.nankai.edu.cn\"\nIAM_BASE = \"\
          https://iam.nankai.edu.cn\"\nLOGIN_PAGE_URL = BASE_URL + \"/Login/index.aspx\"\
          \nLOGIN_API_URL = IAM_BASE + \"/api/v1/login\"\nLIST_URL_TEMPLATE = BASE_URL\
          \ + \"/Index/huodong/p/{page}.aspx\"\n\nHEADERS = {\n    \"User-Agent\"\
          : (\"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 \"\n \
          \                  \"(KHTML, like Gecko) Chrome/120.0 Safari/537.36\"),\n\
          \    \"Accept-Language\": \"zh-CN,zh;q=0.9\",\n}\n\n# 输出字典的字段顺序（与抓取到的 8\
          \ 个要素一致，另加一个详情页链接）\nACTIVITY_KEYS = (\"活动名称\", \"组织机构\", \"联系人\", \"联系电话\"\
          ,\n                 \"活动时间\", \"活动地点\", \"志愿时长\", \"招募人数\")\n\n\n# ============================================================================\n\
          # 1. 密码加密：AES-256-CBC / PKCS7（纯 Python，等价于前端 crypto-js 的结果）\n# ============================================================================\n\
          AES_SEED = \"9007199254740991\"     # 前端 Number.MAX_SAFE_INTEGER.toString()，算法的一部分\n\
          \n\ndef _key_iv():\n    key_hex = hashlib.md5(AES_SEED.encode(\"utf-8\"\
          )).hexdigest()\n    key = key_hex.encode(\"utf-8\")\n    iv = hashlib.sha1(key_hex.encode(\"\
          utf-8\")).hexdigest()[:16].encode(\"utf-8\")\n    return key, iv\n\n\ndef\
          \ _xtime(a):\n    a <<= 1\n    return (a ^ 0x11B) & 0xFF if a & 0x100 else\
          \ a\n\n\ndef _gmul(a, b):\n    result = 0\n    while b:\n        if b &\
          \ 1:\n            result ^= a\n        a = _xtime(a)\n        b >>= 1\n\
          \    return result & 0xFF\n\n\ndef _build_sbox():\n    exp, log = [0] *\
          \ 256, [0] * 256\n    value = 1\n    for i in range(255):\n        exp[i],\
          \ log[value] = value, i\n        value = _gmul(value, 3)\n    box = [0]\
          \ * 256\n    for x in range(256):\n        inv = exp[(255 - log[x]) % 255]\
          \ if x else 0\n        s = inv\n        for shift in (1, 2, 3, 4):\n   \
          \         s ^= ((inv << shift) | (inv >> (8 - shift))) & 0xFF\n        box[x]\
          \ = (s ^ 0x63) & 0xFF\n    return box\n\n\n_SBOX = _build_sbox()\n\n\ndef\
          \ _expand_key(key):\n    nk = len(key) // 4\n    nr = nk + 6\n    words\
          \ = [list(key[4 * i:4 * i + 4]) for i in range(nk)]\n    rcon = 1\n    for\
          \ i in range(nk, 4 * (nr + 1)):\n        temp = list(words[i - 1])\n   \
          \     if i % nk == 0:\n            temp = [_SBOX[temp[1]], _SBOX[temp[2]],\
          \ _SBOX[temp[3]], _SBOX[temp[0]]]\n            temp[0] ^= rcon\n       \
          \     rcon = _xtime(rcon)\n        elif nk > 6 and i % nk == 4:\n      \
          \      temp = [_SBOX[b] for b in temp]\n        words.append([words[i -\
          \ nk][j] ^ temp[j] for j in range(4)])\n    return [bytes(b for word in\
          \ words[4 * r:4 * r + 4] for b in word) for r in range(nr + 1)]\n\n\ndef\
          \ _encrypt_block(block, round_keys):\n    state = list(block)\n    for i\
          \ in range(16):\n        state[i] ^= round_keys[0][i]\n    for rnd in range(1,\
          \ len(round_keys) - 1):\n        state = [_SBOX[b] for b in state]\n   \
          \     state = [state[4 * ((c + r) % 4) + r] for c in range(4) for r in range(4)]\n\
          \        for c in range(4):\n            a0, a1, a2, a3 = state[4 * c:4\
          \ * c + 4]\n            state[4 * c:4 * c + 4] = [\n                _xtime(a0)\
          \ ^ (_xtime(a1) ^ a1) ^ a2 ^ a3,\n                a0 ^ _xtime(a1) ^ (_xtime(a2)\
          \ ^ a2) ^ a3,\n                a0 ^ a1 ^ _xtime(a2) ^ (_xtime(a3) ^ a3),\n\
          \                (_xtime(a0) ^ a0) ^ a1 ^ a2 ^ _xtime(a3),\n           \
          \ ]\n        for i in range(16):\n            state[i] ^= round_keys[rnd][i]\n\
          \    state = [_SBOX[b] for b in state]\n    state = [state[4 * ((c + r)\
          \ % 4) + r] for c in range(4) for r in range(4)]\n    return bytes(x ^ y\
          \ for x, y in zip(state, round_keys[-1]))\n\n\ndef _pad(data):\n    n =\
          \ 16 - len(data) % 16\n    return data + bytes([n]) * n\n\n\ndef _cbc_encrypt(data,\
          \ key, iv):\n    round_keys = _expand_key(key)\n    padded = _pad(data)\n\
          \    out, prev = bytearray(), iv\n    for i in range(0, len(padded), 16):\n\
          \        prev = _encrypt_block(bytes(a ^ b for a, b in zip(padded[i:i +\
          \ 16], prev)), round_keys)\n        out += prev\n    return bytes(out)\n\
          \n\ndef encrypt_password(password):\n    \"\"\"明文密码 -> 十六进制密文；空密码返回空字符串。\"\
          \"\"\n    if password is None:\n        return \"\"\n    data = password\
          \ if isinstance(password, bytes) else str(password).encode(\"utf-8\")\n\
          \    if not data:\n        return \"\"\n    key, iv = _key_iv()\n    return\
          \ _cbc_encrypt(data, key, iv).hex()\n\n\n# ============================================================================\n\
          # 2. 通用小工具\n# ============================================================================\n\
          def _clean(text):\n    \"\"\"压缩空白，顺便把 &nbsp; 之类实体还原。\"\"\"\n    return re.sub(r\"\
          \\s+\", \" \", unescape(text or \"\")).strip()\n\n\ndef _strip_label(text):\n\
          \    \"\"\"去掉 \"活动时间：\" 这类前缀，只留值。\n\n    注意：不能写成 ``^[^:：]*[:：]``，否则纯时间串\
          \ \"2026-11-01 10:00\" 会被截成\n    \"00\"，进而导致日期解析失败、未来活动过滤失效。\n    \"\"\"\
          \n    return re.sub(r\"^[^\\d:：]+[:：]\\s*\", \"\", _clean(text))\n\n\ndef\
          \ _parse_start(text):\n    \"\"\"从 \"2026-11-01 10:00 至 2026-11-15 16:00\"\
          \ 中取出开始时间；失败返回 None。\"\"\"\n    value = _strip_label(text)\n    value =\
          \ re.split(r\"至\", value)[0].strip()\n    match = re.match(r\"(\\d{4})-(\\\
          d{1,2})-(\\d{1,2})\\s+(\\d{1,2}):(\\d{2})\", value)\n    if not match:\n\
          \        return None\n    try:\n        return datetime(*(int(part) for\
          \ part in match.groups()))\n    except ValueError:\n        return None\n\
          \n\ndef _as_int(value, default):\n    try:\n        return int(str(value).strip())\n\
          \    except (TypeError, ValueError):\n        return default\n\n\ndef _as_float(value,\
          \ default):\n    try:\n        return float(str(value).strip())\n    except\
          \ (TypeError, ValueError):\n        return default\n\n\ndef _as_bool(value,\
          \ default):\n    if isinstance(value, bool):\n        return value\n   \
          \ if value is None or value == \"\":\n        return default\n    return\
          \ str(value).strip().lower() in (\"1\", \"true\", \"yes\", \"y\", \"on\"\
          )\n\n\n# ============================================================================\n\
          # 3. HTML 解析（标准库实现，等价于原来 lxml 的 XPath）\n# ============================================================================\n\
          class _DetailParser(HTMLParser):\n    \"\"\"解析活动详情页：标题 + div.xinxi 表格里的\
          \ \"标签/值\" 行。\"\"\"\n\n    def __init__(self):\n        super().__init__(convert_charrefs=True)\n\
          \        self.title = \"\"\n        self.rows = []\n        self._title_parts\
          \ = []\n        self._in_title = False\n        self._xinxi_depth = 0\n\
          \        self._table_depth = 0\n        self._row = None\n        self._cell\
          \ = None\n\n    def handle_starttag(self, tag, attrs):\n        attrs =\
          \ dict(attrs)\n        classes = (attrs.get(\"class\") or \"\").split()\n\
          \        if tag == \"div\":\n            if self._xinxi_depth:\n       \
          \         self._xinxi_depth += 1\n            elif \"xinxi\" in classes:\n\
          \                self._xinxi_depth = 1\n        elif tag == \"p\" and \"\
          hd-title\" in classes:\n            self._in_title = True\n        elif\
          \ self._xinxi_depth:\n            if tag == \"table\":\n               \
          \ self._table_depth += 1\n            elif tag == \"tr\" and self._table_depth\
          \ == 1:\n                self._row = []\n            elif tag in (\"td\"\
          , \"th\") and self._table_depth == 1:\n                self._cell = []\n\
          \n    def handle_endtag(self, tag):\n        if tag == \"div\" and self._xinxi_depth:\n\
          \            self._xinxi_depth -= 1\n            if not self._xinxi_depth:\n\
          \                self._table_depth = 0\n        elif tag == \"p\" and self._in_title:\n\
          \            self._in_title = False\n            self.title = _clean(\"\"\
          .join(self._title_parts))\n        elif self._xinxi_depth:\n           \
          \ if tag in (\"td\", \"th\") and self._table_depth == 1 and self._cell is\
          \ not None:\n                if self._row is not None:\n               \
          \     self._row.append(_clean(\"\".join(self._cell)))\n                self._cell\
          \ = None\n            elif tag == \"tr\" and self._table_depth == 1 and\
          \ self._row is not None:\n                self.rows.append(self._row)\n\
          \                self._row = None\n            elif tag == \"table\":\n\
          \                self._table_depth = max(0, self._table_depth - 1)\n\n \
          \   def handle_data(self, data):\n        if self._in_title:\n         \
          \   self._title_parts.append(data)\n        if self._cell is not None:\n\
          \            self._cell.append(data)\n\n\nclass _ListParser(HTMLParser):\n\
          \    \"\"\"解析列表页：每个 div.huodong 里的详情链接 + 活动时间。\"\"\"\n\n    def __init__(self):\n\
          \        super().__init__(convert_charrefs=True)\n        self.items = []\n\
          \        self._item = None\n        self._div_depth = 0\n        self._first_href\
          \ = None\n        self._tit_href = None\n        self._time_buf = None\n\
          \n    def handle_starttag(self, tag, attrs):\n        attrs = dict(attrs)\n\
          \        classes = (attrs.get(\"class\") or \"\").split()\n        if tag\
          \ == \"div\":\n            if self._item is None:\n                if \"\
          huodong\" in classes:\n                    self._item = {}\n           \
          \         self._div_depth = 1\n                    self._first_href = self._tit_href\
          \ = self._time_buf = None\n            else:\n                self._div_depth\
          \ += 1\n            return\n        if self._item is None:\n           \
          \ return\n        if tag == \"a\":\n            href = (attrs.get(\"href\"\
          ) or \"\").strip()\n            if href:\n                if self._first_href\
          \ is None:\n                    self._first_href = href\n              \
          \  if \"tit\" in classes:\n                    self._tit_href = href\n \
          \       elif tag == \"p\" and \"time\" in classes:\n            self._time_buf\
          \ = []\n\n    def handle_endtag(self, tag):\n        if self._item is None:\n\
          \            return\n        if tag == \"p\" and self._time_buf is not None:\n\
          \            self._item[\"time\"] = _clean(\"\".join(self._time_buf))\n\
          \            self._time_buf = None\n        elif tag == \"div\":\n     \
          \       self._div_depth -= 1\n            if self._div_depth <= 0:\n   \
          \             href = self._tit_href or self._first_href\n              \
          \  if href:\n                    self.items.append({\"href\": href, \"time\"\
          : self._item.get(\"time\", \"\")})\n                self._item = None\n\n\
          \    def handle_data(self, data):\n        if self._time_buf is not None:\n\
          \            self._time_buf.append(data)\n\n\n# 详情页表格里的标签并不统一（发起组织/组织机构、联系人电话/联系电话、\n\
          # 拟招募人数/招募人数），这里做别名映射，输出统一用 ACTIVITY_KEYS 里的名字。\n_LABEL_ALIASES = {\n  \
          \  \"组织机构\": (\"发起组织\", \"组织机构\", \"主办单位\"),\n    \"联系人\": (\"联系人\",),\n\
          \    \"联系电话\": (\"联系人电话\", \"联系电话\"),\n    \"活动时间\": (\"活动时间\",),\n    \"\
