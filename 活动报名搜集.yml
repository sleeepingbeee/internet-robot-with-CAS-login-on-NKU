    - data:
        code: "# -*- coding: utf-8 -*-\n\"\"\"南开 CAS 登录内核（Dify 代码节点版）。\n\n流程：步骤1 预访问\
          \ CAS 入口 → 步骤2 POST 账号密码 → 签发/校验/落地 → 步骤4.5 SSO 中转 → 复核 → 步骤5 爬取。\n\nDify\
          \ 用法：整段粘进代码节点，节点只声明一个输出变量 text（类型 String），\n返回值固定为 {\"text\": \"...\"}（纯文本，格式见\
          \ render_activities_text）。main() 永不抛异常。\n\nDify 的两个硬约束（踩过坑，别再改）：\n  1. 返回值必须恰好只含节点声明过的键。多一个键\
          \ Dify 会报\n     \"Not all output parameters are validated.\"（源码里是\n    \
          \ len(parameters_validated) != len(result) 的判定）。\n  2. 全文不能出现 if __name__\
          \ == \"__main__\" 之类的自执行代码。Dify 把整段代码\n     内联进它自己的 runner 脚本里执行，那段脚本的 __name__\
          \ 就是 \"__main__\"，\n     一旦自执行（尤其 raise SystemExit）就会在 Dify 打结果标记之前退出，\n\
          \     症状是 \"Output result is missing.\"，而且只用 0.1 秒、0 token。\n\n其余接口：\n \
          \   run()                 -> {\"activities\": [...]}  核心实现，不打印任何东西（本地自测用）。\n\
          \    collect_activities()  -> list[dict]             失败抛 CasError，想区分错误类型就用它。\n\
          \    render_activities_text(list) -> str             把活动列表渲染成 main() 返回的那段纯文本。\n\
          \    main(**kwargs)        -> {\"text\": \"...\"}        Dify 入口，只含一个字符串输出。\n\
          账号密码从参数、环境变量 CAS_USERNAME / CAS_PASSWORD 或下面的模块配置读取。\n\"\"\"\n\nimport base64\n\
          import datetime\nimport hashlib\nimport os\nimport re\nimport time\nimport\
          \ warnings\nfrom urllib.parse import quote, unquote, urljoin, urlparse\n\
          \nwarnings.filterwarnings(\"ignore\", message=\".*doesn't match a supported\
          \ version.*\")\n\nimport requests\nfrom html.parser import HTMLParser\n\n\
          try:\n    from Crypto.Cipher import AES as _PyCryptoAES\nexcept Exception:\n\
          \    _PyCryptoAES = None\n\n# ---- 目标站点 ----\nCAS_LOGIN_PAGE_URL = \"https://xgb.nankai.edu.cn/login/fslogin\"\
          \nCAS_AUTH_API_URL = \"https://iam.nankai.edu.cn/api/v1/login\"\nCAS_TICKET_ENDPOINT\
          \ = \"https://iam.nankai.edu.cn/api/cas/login\"\nCAS_TICKET_URL = \"\"\n\
          CAS_SERVICE_URL = \"https://xgb.nankai.edu.cn/login/fslogin\"\nSSO_PORTAL_URL\
          \ = \"https://xgb.nankai.edu.cn/home/user/login.html\"\nSSO_LINK_KEYWORD\
          \ = \"辅学\"\nBUSINESS_ENTRY_URLS = []\n\n# ---- 步骤2 请求形态 ----\nUSERNAME =\
          \ \"\"\nPASSWORD = \"\"\nCREDENTIAL_ENV_USERNAME = \"CAS_USERNAME\"\nCREDENTIAL_ENV_PASSWORD\
          \ = \"CAS_PASSWORD\"\n\n# ---- 调试开关 ----\n# 排查时改成 True：main() 不再吞异常，Dify\
          \ 的 FAIL 面板会直接显示失败阶段和原因。\n# 正常使用时必须保持 False（否则登录失败会让工作流整体报错）。\nRAISE_ERRORS\
          \ = False\n# 内部用：记录当前执行到哪一步，RAISE_ERRORS 打开时把阶段名带进异常信息。\n_STAGE = \"\"\n\
          _TRACE = []\n\n# 说明：main() 只返回一个字符串输出变量 text（不再返回 activities 数组）。\n# text\
          \ 就是 render_activities_text() 渲染出的纯文本，下游 merge_activities_text.py\n# 或 LLM\
          \ / webhook 节点直接消费这段字符串即可。\n\nFORM_FIELD_USERNAME = \"account\"\nFORM_FIELD_PASSWORD\
          \ = \"password\"\nAUTH_API_EXTRA_FORM = {\"login_scene\": \"feilian\", \"\
          account_type\": \"userid\"}\nAUTH_API_EXTRA_QUERY = \"os=web\"\nAUTH_API_CONTENT_TYPE\
          \ = \"json\"\nAUTH_API_EXTRA_HEADERS = {\n    \"X-Version-Check\": \"1\"\
          ,\n    \"X-Fe-Version\": \"3.1.9.15606\",\n    \"Page-Name\": \"portal\"\
          ,\n    \"Accept-Language\": \"zh-CN,zh;q=0.9\",\n}\nAUTH_API_SEND_CSRF_HEADER\
          \ = True\n\n# ---- 判定规则 ----\nTICKET_JSON_KEYS = (\"ticket\", \"serviceTicket\"\
