          \                value = row_map[alias]\n                break\n       \
          \ activity[key] = value\n    return activity\n\n\ndef _parse_list(html_text):\n\
          \    parser = _ListParser()\n    try:\n        parser.feed(html_text or\
          \ \"\")\n        parser.close()\n    except Exception:\n        pass\n \
          \   return parser.items\n\n\ndef _max_page(html_text):\n    pages = re.findall(r\"\
          /Index/huodong/p/(\\d+)\\.aspx\", html_text or \"\", flags=re.I)\n    return\
          \ max((int(page) for page in pages), default=1)\n\n\n# ============================================================================\n\
          # 4. 网络层\n# ============================================================================\n\
          def _build_session():\n    if requests is None:\n        raise RuntimeError(\"\
          当前环境缺少 requests 库，无法发起网络请求\")\n    session = requests.Session()\n    if\
          \ HTTPAdapter is not None and Retry is not None:\n        retry = Retry(total=MAX_RETRIES,\
          \ backoff_factor=0.3,\n                      status_forcelist=(502, 503,\
          \ 504),\n                      allowed_methods=frozenset((\"GET\",)))  \
          \ # 登录 POST 绝不重试\n        adapter = HTTPAdapter(max_retries=retry)\n   \
          \     session.mount(\"https://\", adapter)\n        session.mount(\"http://\"\
          , adapter)\n    return session\n\n\ndef _timeout_left(deadline):\n    left\
          \ = deadline - time.monotonic()\n    if left <= 0:\n        raise TimeoutError(\"\
          已用完时间预算\")\n    return left\n\n\ndef _get(session, url, deadline, allow_redirects=True):\n\
          \    left = _timeout_left(deadline)\n    response = session.get(url, headers=HEADERS,\
          \ allow_redirects=allow_redirects,\n                           timeout=(min(5.0,\
          \ left), min(REQUEST_TIMEOUT, left)))\n    response.encoding = \"utf-8\"\
          \          # 站点声明 charset=utf-8，显式指定防乱码\n    if response.status_code >=\
          \ 400:\n        raise RuntimeError(\"HTTP %s: %s\" % (response.status_code,\
          \ url))\n    return response\n\n\ndef _resolve_login_link(link):\n    \"\
          \"\"把登录接口返回的 next.link 变成可访问的绝对地址。\"\"\"\n    if not link:\n        return\
          \ None\n    link = link.strip()\n    if link.startswith(\"http://\") or\
          \ link.startswith(\"https://\"):\n        url = link\n    else:\n      \
          \  url = urljoin(IAM_BASE, link)\n    if \"lang=\" not in url:\n       \
          \ url += (\"&\" if \"?\" in url else \"?\") + \"lang=zh-CN\"\n    return\
          \ url\n\n\ndef _login(session, username, password, deadline):\n    \"\"\"\
          登录并建立业务系统会话；失败返回 False（列表/详情页本身是公开的，可继续抓）。\"\"\"\n    _get(session, LOGIN_PAGE_URL,\
          \ deadline)          # 拿 csrf-token / session / PHPSESSID\n    payload =\
          \ {\n        \"account\": username,\n        \"password\": encrypt_password(password),\n\
          \        \"account_type\": \"userid\",\n        \"login_scene\": \"feilian\"\
          ,\n    }\n    headers = dict(HEADERS)\n    headers[\"Referer\"] = IAM_BASE\
          \ + \"/login\"\n    csrf = session.cookies.get(\"csrf-token\")\n    if csrf:\n\
          \        headers[\"csrf-token\"] = csrf\n    login_url = \"%s?os=web&t=%d\"\
          \ % (LOGIN_API_URL, int(time.time() * 1000))\n    left = _timeout_left(deadline)\n\
          \    response = session.post(login_url, json=payload, headers=headers,\n\
          \                            allow_redirects=False,\n                  \
          \          timeout=(min(5.0, left), min(REQUEST_TIMEOUT, left)))\n    response.encoding\
          \ = \"utf-8\"\n    if response.status_code >= 400:\n        return False\n\
          \    try:\n        data = json.loads(response.text)\n    except Exception:\n\
          \        return False\n    if not isinstance(data, dict):\n        return\
          \ False\n    link = ((data.get(\"data\") or {}).get(\"next\") or {}).get(\"\
          link\")\n    target = _resolve_login_link(link)\n    if not target:\n  \
          \      return False\n    _get(session, target, deadline, allow_redirects=True)\n\
          \    return True\n\n\n# ============================================================================\n\
          # 5. 抓取\n# ============================================================================\n\
          def _wanted(activity, only_future):\n    if not only_future:\n        return\
          \ True\n    start = _parse_start(activity.get(\"活动时间\", \"\"))\n    return\
          \ start is None or start > datetime.now()\n\n\ndef _crawl(session, max_pages,\
          \ only_future, delay, deadline):\n    activities = []\n    seen = set()\n\
          \n    first = _get(session, LIST_URL_TEMPLATE.format(page=1), deadline)\n\
          \    first_html = first.text\n    total_pages = min(max_pages, _max_page(first_html))\n\
          \    total_pages = max(total_pages, 1)\n\n    for page in range(1, total_pages\
          \ + 1):\n        try:\n            if page == 1:\n                html_text\
          \ = first_html\n            else:\n                html_text = _get(session,\
          \ LIST_URL_TEMPLATE.format(page=page), deadline).text\n        except TimeoutError:\n\
          \            break\n\n        for item in _parse_list(html_text):\n    \
          \        if time.monotonic() > deadline:\n                return activities\n\
          \            detail_url = urljoin(BASE_URL, item[\"href\"])\n          \
          \  if detail_url in seen:\n                continue\n            seen.add(detail_url)\n\
          \            # 列表卡片上已有时间，先粗筛一遍，省掉过期活动的详情请求\n            if only_future:\n\
          \                start = _parse_start(item.get(\"time\", \"\"))\n      \
          \          if start is not None and start <= datetime.now():\n         \
          \           continue\n            try:\n                detail_html = _get(session,\
          \ detail_url, deadline).text\n                activity = _parse_detail(detail_html)\n\
          \            except TimeoutError:\n                return activities\n \
          \           except Exception:\n                continue                \
          \      # 单条详情失败不影响整体\n            activity[\"链接\"] = detail_url\n      \
          \      if _wanted(activity, only_future):\n                activities.append(activity)\n\
          \            if delay > 0:\n                time.sleep(min(delay, max(0.0,\
          \ deadline - time.monotonic())))\n\n    activities.sort(key=lambda item:\
          \ _parse_start(item.get(\"活动时间\", \"\")) or datetime.max)\n    return activities\n\
          \n\n# ============================================================================\n\
          # 6. 文本渲染（给 LLM 节点当 context，必须是字符串）\n# ============================================================================\n\
          def _render_text(activities):\n    if not activities:\n        return \"\
          本次没有抓取到符合条件的活动。\"\n    lines = [\"共 %d 场活动：\" % len(activities)]\n    for\
          \ index, activity in enumerate(activities, 1):\n        lines.append(\"\
          %d. %s\" % (index, activity.get(\"活动名称\", \"\")))\n        for key in ACTIVITY_KEYS[1:]:\n\
          \            lines.append(\"   %s：%s\" % (key, activity.get(key, \"\")))\n\
          \        if activity.get(\"链接\"):\n            lines.append(\"   链接：%s\"\
          \ % activity[\"链接\"])\n    return \"\\n\".join(lines)\n\n\n# ============================================================================\n\
          # 7. Dify 入口\n# ============================================================================\n\
          def _resolve_credentials(kwargs):\n    username = kwargs.get(\"username\"\
          ) or USERNAME\n    password = kwargs.get(\"password\") or PASSWORD\n   \
          \ return str(username or \"\").strip(), str(password or \"\").strip()\n\n\
          \ndef main(**kwargs):\n    \"\"\"Dify 代码节点入口：永远返回 {\"text\": \"...\"}（只有一个\
          \ String 输出）。\n\n    可用输入变量（都可省略）：\n        username / password        \
          \   账号密码（string）\n        crawl_max_pages               最多翻几页（number，默认\
          \ 1）\n        crawl_delay                   详情页间隔秒数（number，默认 0）\n     \
          \   request_timeout               单请求超时（number）\n        deadline_seconds\
          \              整体时间预算（number）\n        crawl_only_future             是否只看未来（boolean）\n\
          \    \"\"\"\n    activities = []\n    text = \"\"\n    try:\n        if\
          \ requests is None:\n            raise RuntimeError(\"当前环境缺少 requests 库，无法发起网络请求\"\
          )\n        request_timeout = _as_int(kwargs.get(\"request_timeout\"), REQUEST_TIMEOUT)\n\
          \        globals()[\"REQUEST_TIMEOUT\"] = max(1, request_timeout)\n    \
          \    deadline = time.monotonic() + max(1, _as_int(kwargs.get(\"deadline_seconds\"\
          ),\n                                                     DEADLINE_SECONDS))\n\
          \        max_pages = max(1, _as_int(kwargs.get(\"crawl_max_pages\"), CRAWL_MAX_PAGES))\n\
          \        delay = max(0.0, _as_float(kwargs.get(\"crawl_delay\"), CRAWL_DELAY))\n\
          \        only_future = _as_bool(kwargs.get(\"crawl_only_future\"), CRAWL_ONLY_FUTURE)\n\
          \        username, password = _resolve_credentials(kwargs)\n\n        session\
          \ = _build_session()\n        if username and password:\n            try:\n\
          \                _login(session, username, password, deadline)\n       \
          \     except Exception:\n                pass                       # 登录失败仍可抓公开内容（电话显示\"\
          登录后可看\"）\n        activities = _crawl(session, max_pages, only_future, delay,\
          \ deadline)\n        text = _render_text(activities)\n    except Exception\
          \ as exc:\n        if RAISE_ERRORS:\n            raise\n        text = \"\
          抓取失败：%s: %s\" % (type(exc).__name__, exc)\n    # 只返回节点里声明过的键，多一个少一个都会让 Dify\
          \ 报\n    # \"Not all output parameters are validated.\"\n    return {\"\
          text\": text}\n\n\n# ============================================================================\n\
          # 部署到 Dify「代码执行」节点：\n#   1) 整份文件粘贴进节点（Python 3，已预装 requests 即可，无需其他依赖）；\n\
          #   2) 输出变量只声明一个：text（String）；\n#      多声明/少声明都会触发 \"Not all output parameters\
          \ are validated\"；\n#   3) 输入变量（均可选）：username、password、crawl_max_pages、crawl_delay、\n\
          #      request_timeout、deadline_seconds、crawl_only_future；\n#   4) 节点超时要\
          \ ≥ 30s：本内核默认在 20s 预算内返回，超预算会带着已抓到的数据退出。\n#\n# 本地自测（不写文件）：\n#   python -c\
          \ \"import cas_core,json;print(json.dumps(cas_core.main(),ensure_ascii=False))\"\
          \n# ============================================================================\n"
        code_language: python3
