          , \"招募人数\"),\n}\n\n\ndef _parse_detail(html_text):\n    parser = _DetailParser()\n\
          \    try:\n        parser.feed(html_text or \"\")\n        parser.close()\n\
          \    except Exception:\n        pass\n    row_map = {}\n    for row in parser.rows:\n\
          \        if len(row) >= 2 and row[0]:\n            row_map[row[0].rstrip(\"\
          ：:\").strip()] = row[1]\n    activity = {\"活动名称\": parser.title or \"\"\
          }\n    for key in ACTIVITY_KEYS[1:]:\n        value = \"\"\n        for\
