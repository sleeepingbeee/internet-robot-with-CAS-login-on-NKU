    - data:
        code: "# -*- coding: utf-8 -*-\n\"\"\"merge_activities_text.py —— Dify「代码执行」节点：把两个抓取节点输出的\
          \ text 合并成一段文本。\n\n用途\n----\n上游两个代码节点（zyfw 志愿系统 cas_core.py / 辅学平台 CAS 内核）各自输出一份形如\n\
          \n    共 N 场活动：\n    1. 活动名称\n       活动时间：...\n       活动地点：...\n\n的 text。本节点把两份\
          \ text 合并成**一段**同样格式的 text：\n\n    共 (N1 + N2) 场活动：\n    1. 活动名称\n     \
          \  ...\n    ...\n\n活动条目按「先第一个节点、后第二个节点」的顺序拼接，序号由本节点统一重排。\n\nDify 硬约束（改代码时别破坏）\n\
          -----------------------------\n1. 入口必须是 ``def main(**kwargs) -> dict``；\n\
          2. 返回 dict 的键必须和节点里声明的「输出变量」**完全一致** —— 本节点只返回\n   ``{\"text\": ...}``，所以节点里只声明一个输出变量\
          \ text（String）。多返回一个键会报\n   ``Not all output parameters are validated.``；\n\
          3. 模块顶层不能有 print / 自执行 / 文件读写（Dify 会把整段代码内联进自己的 runner，\n   任何自执行块都可能导致\
          \ ``Output result is missing.``）；\n4. 只依赖标准库。\n\n节点输入变量（在 Dify 里声明，再把上游节点的输出映射进来）\n\
          ----------------------------------------------------------\n必填（二选一，推荐同时映射\
          \ text）：\n    text1  String   第一个抓取节点（zyfw）输出的 text\n    text2  String \
          \  第二个抓取节点（辅学平台）输出的 text\n可选（结构化输入优先于 text 解析，避免二次解析）：\n    activities1\
          \  Array[Object]   第一个抓取节点的 activities\n    activities2  Array[Object] \
          \  第二个抓取节点的 activities\n\n另外兼容 text_a/text_b、activities_a/activities_b 等别名；上游没开\
          \ include_text 时\n只传 activities1 / activities2 也可以。\n\n节点输出变量（只声明这一个）：\n\
          \    text  String\n\"\"\"\n\nimport json\nimport re\n\n# ============================================================================\n\
          # 配置区\n# ============================================================================\n\
          # 合并后每场活动的字段顺序：先两个平台共有的字段，再各自的特色字段。\n# 该顺序同时适用于「text 解析」和「activities 结构化渲染」两条路径。\n\
          FIELD_ORDER = (\n    \"活动名称\",\n    \"组织机构\", \"联系人\", \"联系电话\",\n    \"\
          活动时间\", \"活动地点\",\n    \"志愿时长\", \"招募人数\",\n    \"活动类型\", \"活动学时\",\n  \
          \  \"链接\",\n)\n\n# 字段别名：两个内核里同一含义的不同叫法都兜住（如 发起组织/组织机构、\n# 联系人电话/联系电话、拟招募人数/招募人数、学时/学分）。\n\
          FIELD_ALIASES = {\n    \"活动名称\": (\"活动名称\", \"标题\", \"name\", \"title\"\
          ),\n    \"组织机构\": (\"组织机构\", \"发起组织\", \"主办单位\"),\n    \"联系人\": (\"联系人\"\
          ,),\n    \"联系电话\": (\"联系电话\", \"联系人电话\"),\n    \"活动时间\": (\"活动时间\", \"举办时间\"\
          , \"活动日期\"),\n    \"活动地点\": (\"活动地点\", \"举办地点\", \"活动场地\"),\n    \"志愿时长\"\
          : (\"志愿时长\",),\n    \"招募人数\": (\"招募人数\", \"拟招募人数\"),\n    \"活动类型\": (\"\
          活动类型\", \"活动类别\"),\n    \"活动学时\": (\"活动学时\", \"实践学时\", \"学时\", \"学分\"),\n\
          \    \"链接\": (\"链接\", \"详情页链接\", \"url\", \"href\"),\n}\n\n# kwargs 里不同命名的别名表（Dify\
          \ 里变量名随用户习惯而定，多兜几个）\n_TEXT1_KEYS = (\"text1\", \"text_a\", \"a_text\", \"\
          text_1\")\n_TEXT2_KEYS = (\"text2\", \"text_b\", \"b_text\", \"text_2\"\
          )\n_ACT1_KEYS = (\"activities1\", \"activities_a\", \"a_activities\", \"\
          activities_1\")\n_ACT2_KEYS = (\"activities2\", \"activities_b\", \"b_activities\"\
          , \"activities_2\")\n\n# 行级解析规则\n_HEADER_RE = re.compile(r\"^共\\s*\\d+\\\
          s*场活动\\s*[:：]?\\s*$\")        # \"共 5 场活动：\"\n_ENTRY_RE = re.compile(r\"\
          ^(\\d+)\\s*[.、．)）]\\s*(.*)$\")              # \"1. 活动名称\"\n_NOTE_RE = re.compile(r\"\
          (抓取失败|没有抓取到|未抓取到|没有符合|暂无|没有活动|本次没有)\")\n_EMPTY_VALUE_RE = re.compile(r\"\
          ^[^:：]{1,30}[:：]\\s*$\")             # \"组织机构：\" 这种空值行\n\nUNNAMED_ACTIVITY\
          \ = \"（未命名活动）\"\nEMPTY_TEXT = \"共 0 场活动：\"\n\n\n# ============================================================================\n\
          # 小工具\n# ============================================================================\n\
          def _as_text(value):\n    \"\"\"任意值 -> str（None 变成空串，绝不抛异常）。\"\"\"\n   \
          \ if value is None:\n        return \"\"\n    if isinstance(value, str):\n\
          \        return value\n    try:\n        return str(value)\n    except Exception:\n\
          \        return \"\"\n\n\ndef _collapse(value):\n    \"\"\"压缩空白，顺便去掉首尾空白。\"\
          \"\"\n    return re.sub(r\"\\s+\", \" \", _as_text(value)).strip()\n\n\n\
          def _pick(kwargs, names):\n    \"\"\"按别名顺序从 kwargs 里取第一个非空的参数；都没有返回 None。\"\
          \"\"\n    for name in names:\n        if name in kwargs:\n            value\
          \ = kwargs[name]\n            if value is not None and value != \"\":\n\
          \                return value\n    return None\n\n\n# ============================================================================\n\
          # 路径一：从上游返回的 activities 数组渲染（首选，结构稳定）\n# ============================================================================\n\
          def _blocks_from_activities(items):\n    \"\"\"list[dict] -> [(标题, [字段行,\
          \ ...]), ...]。\"\"\"\n    blocks = []\n    if not isinstance(items, list):\n\
          \        return blocks\n    for item in items:\n        if not isinstance(item,\
          \ dict):\n            continue\n        title = \"\"\n        details =\
          \ []\n        for key in FIELD_ORDER:\n            value = \"\"\n      \
          \      for alias in FIELD_ALIASES.get(key, (key,)):\n                candidate\
          \ = _collapse(item.get(alias))\n                if candidate:\n        \
          \            value = candidate\n                    break\n            if\
          \ key == \"活动名称\":\n                title = value\n            elif value:\n\
          \                details.append(\"%s：%s\" % (key, value))\n        if not\
          \ title and not details:\n            continue\n        blocks.append((title\
          \ or UNNAMED_ACTIVITY, details))\n    return blocks\n\n\n# ============================================================================\n\
          # 路径二：从上游返回的 text 解析（上游没把 activities 传进来时用）\n# ============================================================================\n\
          def _blocks_from_text(raw):\n    \"\"\"把 \"共 N 场活动：1. 名称\\\\n   字段：值 ...\"\
          \ 解析成 [(标题, [字段行...]), ...]。\"\"\"\n    blocks = []\n    current = None\n\
          \    for line in _as_text(raw).splitlines():\n        if not line.strip():\n\
          \            continue\n        # 1) 汇总行：跳过（总数由本节点重新统计）\n        if _HEADER_RE.match(line.strip()):\n\
          \            continue\n        # 2) 缩进行：属于当前活动的 \"字段：值\"\n        if line[0].isspace():\n\
          \            if current is not None:\n                detail = _collapse(line)\n\
          \                if detail and not _EMPTY_VALUE_RE.match(detail):\n    \
          \                current[1].append(detail)\n            continue\n     \
          \   # 3) 顶格编号行：一场新活动\n        entry = _ENTRY_RE.match(line.strip())\n  \
          \      if entry is not None:\n            current = [_collapse(entry.group(2)),\
          \ []]\n            blocks.append(current)\n            continue\n      \
          \  text = _collapse(line)\n        if not text:\n            continue\n\
          \        # 4) 抓取失败 / 无结果之类的提示行：不是活动，跳过\n        if _NOTE_RE.search(text):\n\
          \            current = None\n            continue\n        # 5) 顶格但没有编号的标题行：也当成一场活动，避免漏数据\n\
          \        current = [text, []]\n        blocks.append(current)\n    return\
          \ blocks\n\n\ndef _source_blocks(kwargs, activity_keys, text_keys):\n  \
          \  \"\"\"单个上游节点的数据 -> blocks。非空 activities 数组优先，其次 text。\"\"\"\n    activities\
          \ = _pick(kwargs, activity_keys)\n    if isinstance(activities, list) and\
          \ activities:\n        return _blocks_from_activities(activities)\n    if\
          \ isinstance(activities, str) and activities:\n        # Dify 有时会把 Array\
          \ 变量序列化成 JSON 字符串传进来\n        try:\n            parsed = json.loads(activities)\n\
          \        except Exception:\n            parsed = None\n        if isinstance(parsed,\
          \ list) and parsed:\n            return _blocks_from_activities(parsed)\n\
          \    raw = _pick(kwargs, text_keys)\n    if not isinstance(raw, str):  \
          \      # 没传 text / 类型不对：视为该来源为空\n        return []\n    return _blocks_from_text(raw)\n\
          \n\n# ============================================================================\n\
          # 合并渲染\n# ============================================================================\n\
          def _render(blocks):\n    \"\"\"[(标题, [字段行...]), ...] -> \"共 N 场活动：...\"\
          \ 文本。\"\"\"\n    cleaned = []\n    for title, details in blocks or ():\n\
          \        title = _collapse(title) or UNNAMED_ACTIVITY\n        lines = []\n\
          \        for detail in details or ():\n            detail = _collapse(detail)\n\
          \            if detail and not _EMPTY_VALUE_RE.match(detail):\n        \
          \        lines.append(detail)\n        cleaned.append((title, lines))\n\n\
          \    if not cleaned:\n        return EMPTY_TEXT\n\n    output = [\"共 %d\
          \ 场活动：\" % len(cleaned)]\n    for index, (title, details) in enumerate(cleaned,\
          \ 1):\n        output.append(\"%d. %s\" % (index, title))\n        for detail\
          \ in details:\n            output.append(\"   %s\" % detail)\n    return\
          \ \"\\n\".join(output)\n\n\ndef merge(text1=\"\", text2=\"\", activities1=None,\
          \ activities2=None):\n    \"\"\"纯函数：合并两份活动数据，返回合并后的文本（供本地测试/复用）。\"\"\"\n\
          \    kwargs = {\"text1\": text1, \"text2\": text2,\n              \"activities1\"\
          : activities1, \"activities2\": activities2}\n    blocks = []\n    blocks.extend(_source_blocks(kwargs,\
          \ _ACT1_KEYS, _TEXT1_KEYS))\n    blocks.extend(_source_blocks(kwargs, _ACT2_KEYS,\
          \ _TEXT2_KEYS))\n    return _render(blocks)\n\n\n# ============================================================================\n\
          # Dify 入口\n# ============================================================================\n\
          def main(**kwargs):\n    \"\"\"Dify 代码节点入口：永远返回 {\"text\": \"...\"}，不抛异常。\n\
          \n    可用输入变量：text1 / text2（String）、activities1 / activities2（Array[Object]）。\n\
          \    \"\"\"\n    try:\n        kwargs = kwargs or {}\n        blocks = []\n\
          \        blocks.extend(_source_blocks(kwargs, _ACT1_KEYS, _TEXT1_KEYS))\n\
          \        blocks.extend(_source_blocks(kwargs, _ACT2_KEYS, _TEXT2_KEYS))\n\
          \        text = _render(blocks)\n    except Exception:\n        text = EMPTY_TEXT\n\
          \    # 只返回节点里声明过的键，多一个少一个都会让 Dify 报\n    # \"Not all output parameters are\
          \ validated.\"\n    return {\"text\": text}\n\n\n# ============================================================================\n\
          # 部署到 Dify「代码执行」节点：\n#   1) 整份文件粘进节点（Python 3，纯标准库，无需 requests）；\n#   2)\
          \ 输出变量只声明一个：text（String）；\n#   3) 输入变量（都可选）：text1、text2、activities1、activities2；\n\
          #      最省事的接法：text1 = 上游节点1的 text，text2 = 上游节点2的 text；\n#   4) 上游节点必须打开\
          \ include_text（两个内核默认都是 True），否则改为映射\n#      activities1 / activities2。\n\
          # ============================================================================\n"
        code_language: python3
