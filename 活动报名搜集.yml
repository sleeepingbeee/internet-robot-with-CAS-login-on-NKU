    - data:
        code: "# -*- coding: utf-8 -*-\n\"\"\"filter_activities_by_db.py —— Dify「代码执行」节点：按数据库已有活动名称过滤爬虫结果。\n\
          \n用途\n----\n上游两个节点：\n  text1  爬虫节点输出的 text，形如\n         \"共 N 场活动：\\n1.\
          \ 活动名称\\n   组织机构：...\\n   活动时间：...\"\n  text2  SQLite 插件「查询行（Select Rows）」节点的输出，两种都认：\n\
          \         - text 变量：\"Table: activities\\nColumns: ...\\nRows: 26\\nData:\
          \ [{'活动名称': ...}, ...]\"\n           （注意 Data 里是 Python repr，单引号 / None，不是\
          \ JSON）\n         - json 变量：{\"query\": ..., \"table\": ..., \"columns\"\
          : [...], \"data\": [...], \"row_count\": 26, \"status\": \"success\"}\n\n\
          处理逻辑\n--------\n按「活动名称」比对（忽略所有空白字符、全角空格、大小写差异）：\n数据库里已经存在的整条丢弃，剩下的按**原来的文本格式**重新从\
          \ 1 编号输出，\n仍然是一段字符串。抓虫结果为空 / 数据库为空 / text2 解析失败时都不会丢数据。\n\nDify 硬约束（改代码时别破坏）\n\
          ----------------------------\n1. 入口必须是 def main(**kwargs) -> dict；\n2. 只返回\
          \ {\"text\": ...} 这一个键 → 节点「输出变量」只声明 text（String）。\n   多返回一个键会报 \"Not all\
          \ output parameters are validated.\"；\n3. 模块顶层不能有 print / 自执行 / 文件读写，否则可能\
          \ \"Output result is missing.\"；\n4. 只依赖标准库（json / re / ast）。\n\n节点输入变量（在\
          \ Dify 里声明，再把上游输出映射进来）\n----------------------------------------------------\n\
          \    text1  String   爬虫节点输出的 text\n    text2  String   「查询行」节点的 text（或 json）\n\
          \n节点输出变量（只声明这一个）：\n    text   String\n\"\"\"\n\nimport ast\nimport json\n\
          import re\n\n# ---------------------------------------------------------------------------\n\
          # 输入变量别名（Dify 里变量名随习惯而定，多兜几个，取第一个非空的）\n# ---------------------------------------------------------------------------\n\
          _TEXT1_KEYS = (\"text1\", \"crawler_text\", \"spider_text\", \"new_text\"\
          ,\n               \"text_a\", \"a_text\", \"text_1\", \"爬虫text\", \"抓取结果\"\
          )\n_TEXT2_KEYS = (\"text2\", \"db_text\", \"database_text\", \"existing_text\"\
          , \"db_result\",\n               \"text_b\", \"b_text\", \"text_2\", \"\
          数据库text\", \"已有数据\")\n\n_HEADER_RE = re.compile(r\"^共\\s*\\d+\\s*场活动\\s*[:：]?\\\
          s*$\")   # \"共 49 场活动：\"\n_ENTRY_RE = re.compile(r\"^(\\d+)\\s*[.、．)）]\\\
          s*(.*)$\")         # \"1. 活动名称\"\n_NOTE_RE = re.compile(r\"(抓取失败|没有抓取到|未抓取到|没有符合|暂无|没有活动|本次没有)\"\
          )\n_DATA_RE = re.compile(r\"\\bData\\s*[:：]\\s*\", re.S)              #\
          \ \"Data: [...]\"\n\nUNNAMED_ACTIVITY = \"（未命名活动）\"\nEMPTY_TEXT = \"共 0\
          \ 场活动：\"\n\n# 比对时忽略的不可见 / 空白字符\n_BLANK_CHARS = (\"\\ufeff\", \"\\u200b\"\
          , \"\\u200c\", \"\\u200d\", \"\\u3000\", \"\\xa0\")\n\n\n# ---------------------------------------------------------------------------\n\
          # 小工具\n# ---------------------------------------------------------------------------\n\
          def _as_text(value):\n    \"\"\"任意值 -> str（None 变空串，绝不抛异常）。\"\"\"\n    if\
          \ value is None:\n        return \"\"\n    if isinstance(value, str):\n\
          \        return value\n    try:\n        return str(value)\n    except Exception:\n\
          \        return \"\"\n\n\ndef _collapse(value):\n    \"\"\"多行/连续空白压成一个空格并去首尾空白。\"\
          \"\"\n    return re.sub(r\"\\s+\", \" \", _as_text(value)).strip()\n\n\n\
          def _name_key(value):\n    \"\"\"活动名称归一化：去掉所有空白（含全角空格、BOM/零宽），统一大小写。\"\"\
          \"\n    text = _as_text(value)\n    for ch in _BLANK_CHARS:\n        text\
          \ = text.replace(ch, \" \")\n    return re.sub(r\"\\s+\", \"\", text).strip().casefold()\n\
          \n\ndef _pick(kwargs, names):\n    \"\"\"按别名顺序取第一个非空参数；都没有返回空串。\"\"\"\n\
          \    for name in names:\n        if name in kwargs:\n            value =\
          \ kwargs[name]\n            if value is not None and value != \"\":\n  \
          \              return value\n    return \"\"\n\n\n# ---------------------------------------------------------------------------\n\
          # 1. 解析爬虫文本 -> [(标题, [字段行, ...]), ...]\n# ---------------------------------------------------------------------------\n\
          def _parse_crawler_text(raw):\n    blocks = []\n    current = None\n   \
          \ for line in _as_text(raw).splitlines():\n        if not line.strip():\n\
          \            continue\n        stripped = line.strip()\n        # 汇总行：\"\
          共 N 场活动：\" 跳过（总数由本节点重新统计）\n        if _HEADER_RE.match(stripped):\n    \
          \        continue\n        # 缩进行：当前活动的 \"字段：值\"\n        if line[0].isspace():\n\
          \            if current is not None and stripped:\n                current[1].append(stripped)\n\
          \            continue\n        # 顶格编号行：一场新活动\n        entry = _ENTRY_RE.match(stripped)\n\
          \        if entry is not None:\n            current = [entry.group(2).strip(),\
          \ []]\n            blocks.append(current)\n            continue\n      \
          \  # \"抓取失败：…\" / \"本次没有抓取到…\" 之类的提示行：不是活动，跳过\n        if _NOTE_RE.search(stripped):\n\
          \            current = None\n            continue\n        # 顶格但没编号：也当成一场活动，避免漏数据\n\
          \        current = [stripped, []]\n        blocks.append(current)\n    return\
          \ blocks\n\n\n# ---------------------------------------------------------------------------\n\
          # 2. 渲染回原来的文本格式\n# ---------------------------------------------------------------------------\n\
          def _render(blocks):\n    cleaned = []\n    for title, details in blocks:\n\
          \        title = _collapse(title) or UNNAMED_ACTIVITY\n        lines = [d\
          \ for d in (_collapse(line) for line in details) if d]\n        cleaned.append((title,\
          \ lines))\n    if not cleaned:\n        return EMPTY_TEXT\n    output =\
          \ [\"共 %d 场活动：\" % len(cleaned)]\n    for index, (title, lines) in enumerate(cleaned,\
          \ 1):\n        output.append(\"%d. %s\" % (index, title))\n        for line\
          \ in lines:\n            output.append(\"   %s\" % line)\n    return \"\\\
          n\".join(output)\n\n\n# ---------------------------------------------------------------------------\n\
          # 3. 解析数据库文本 -> list[dict]\n# ---------------------------------------------------------------------------\n\
          def _rows_from_obj(obj):\n    \"\"\"把 json / literal_eval 的结果统一成「列表」；认不出来返回\
          \ None。\"\"\"\n    if isinstance(obj, dict):\n        for key in (\"data\"\
          , \"rows\", \"records\", \"data_list\"):\n            value = obj.get(key)\n\
          \            if isinstance(value, list):\n                return value\n\
          \        if any(key in obj for key in (\"活动名称\", \"名称\", \"name\", \"title\"\
          )):\n            return [obj]\n        return None\n    if isinstance(obj,\
          \ list):\n        return obj\n    return None\n\n\ndef _parse_db_rows(db_text):\n\
          \    text = _as_text(db_text).strip()\n    if not text:\n        return\
          \ None\n    # a) 插件 json 变量 / 直接是 JSON 数组\n    try:\n        parsed = json.loads(text)\n\
          \    except Exception:\n        parsed = None\n    rows = _rows_from_obj(parsed)\
          \ if parsed is not None else None\n    if rows is not None:\n        return\
          \ rows\n    # b) 插件 text 变量：\"... Data: [{'活动名称': ...}]\"（Python repr）\n\
          \    match = _DATA_RE.search(text)\n    if match is not None:\n        payload\
          \ = text[match.end():].strip()\n        try:\n            parsed = ast.literal_eval(payload)\n\
          \        except Exception:\n            parsed = None\n        rows = _rows_from_obj(parsed)\n\
          \        if rows is not None:\n            return rows\n    # c) 整段就是 Python\
          \ repr 的列表\n    try:\n        parsed = ast.literal_eval(text)\n    except\
          \ Exception:\n        parsed = None\n    return _rows_from_obj(parsed)\n\
          \n\ndef _db_name_keys(db_text):\n    \"\"\"数据库里已有的活动名称集合；无法解析时返回 None（表示「不知道」，不过滤）。\"\
          \"\"\n    rows = _parse_db_rows(db_text)\n    if rows is None:\n       \
          \ return None\n    keys = set()\n    for row in rows:\n        if not isinstance(row,\
          \ dict):\n            continue\n        for column in (\"活动名称\", \"名称\"\
          , \"name\", \"title\"):\n            if column in row:\n               \
          \ key = _name_key(row.get(column))\n                if key:\n          \
          \          keys.add(key)\n                break\n    return keys\n\n\n#\
          \ ---------------------------------------------------------------------------\n\
          # 4. 纯函数：过滤 + 渲染\n# ---------------------------------------------------------------------------\n\
          def filter_activities(crawler_text=\"\", db_text=\"\"):\n    \"\"\"爬虫文本里去掉数据库已有活动，返回同样格式的字符串。\"\
          \"\"\n    blocks = _parse_crawler_text(crawler_text)\n    if not blocks:\n\
          \        # 上游是 \"本次没有抓取到…\" / \"抓取失败：…\" 之类的提示：原样返回\n        return _as_text(crawler_text).strip()\
          \ or EMPTY_TEXT\n    db_keys = _db_name_keys(db_text)\n    if db_keys is\
          \ None:\n        # 没拿到数据库数据 / 解析失败：不过滤，保证不丢活动\n        return _render(blocks)\n\
          \    kept = [block for block in blocks if _name_key(block[0]) not in db_keys]\n\
          \    return _render(kept)\n\n\n# ---------------------------------------------------------------------------\n\
          # 5. Dify 入口\n# ---------------------------------------------------------------------------\n\
          def main(**kwargs):\n    \"\"\"Dify 代码节点入口：永远返回 {\"text\": \"...\"}，不抛异常。\"\
          \"\"\n    crawler_text = \"\"\n    text = EMPTY_TEXT\n    try:\n       \
          \ kwargs = kwargs or {}\n        crawler_text = _as_text(_pick(kwargs, _TEXT1_KEYS))\n\
          \        db_text = _as_text(_pick(kwargs, _TEXT2_KEYS))\n        text =\
          \ filter_activities(crawler_text, db_text)\n    except Exception:\n    \
          \    # 兜底：至少把爬虫原文还回去，绝不因为过滤失败把活动弄丢\n        text = crawler_text.strip()\
          \ or EMPTY_TEXT\n    # 只返回节点里声明过的键，多一个少一个都会让 Dify 报\n    # \"Not all output\
          \ parameters are validated.\"\n    return {\"text\": text}\n\n\n# ---------------------------------------------------------------------------\n\
          # 部署到 Dify「代码执行」节点：\n#   1) 整份文件粘进节点（Python 3，纯标准库）；\n#   2) 输出变量只声明一个：text（String）；\n\
          #   3) 输入变量声明 text1、text2（String），分别映射爬虫节点.text\n#      和「查询行」节点的 text（或\
          \ json）；\n#   4) 返回空时是 \"共 0 场活动：\"，下游可直接判断或照常推送。\n# ---------------------------------------------------------------------------\n"
        code_language: python3
        outputs:
          text:
            children: null
            type: string
        selected: false
        title: 根据数据库去重
        type: code
        variables:
        - value_selector:
          - '1792311372098'
          - text
          value_type: string
          variable: text1
        - value_selector:
          - '1792809298130'
          - text
          value_type: string
          variable: text2
      height: 50
      id: '1792809593300'
      position:
        x: 1405
        y: 191.4047619047619
      positionAbsolute:
        x: 1405
        y: 191.4047619047619
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
