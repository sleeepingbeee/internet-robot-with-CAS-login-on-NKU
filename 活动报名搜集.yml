    - data:
        code: "# -*- coding: utf-8 -*-\n\"\"\"build_insert_sql.py —— Dify「代码执行」节点：把去重后的活动文本转成一条\
          \ INSERT 语句。\n\n上游\n----\n过滤节点输出的 text（形如 \"共 24 场活动：\\n1. 活动名称\\n   组织机构：...\\\
          n   活动时间：...\"）。\n也兼容直接把 {\"text\": \"...\"} 整段当字符串传进来。\n\n下游\n----\n把 sql\
          \ 变量喂给 SQLite 插件「插入行（Insert Rows）」节点的 insert_sql 参数：\n    INSERT OR IGNORE\
          \ INTO activities (...) VALUES (...), (...), ...;\n为什么用一条多行 INSERT 而不是每行一次：\n\
          \  - 插件是 conn.execute()，一次只能执行一条语句，不能写多个分号；\n  - INSERT OR IGNORE + UNIQUE(来源系统,活动名称,活动时间)\
          \ 天然幂等，重复跑不会出重复行；\n  - 没有活动时输出一条 \"INSERT ... SELECT NULL WHERE 0;\" 空语句，插件不会报错。\n\
          \nDify 硬约束\n-----------\n1. 入口 def main(**kwargs) -> dict；\n2. 输出变量声明 sql(String)\
          \ / text(String) / count(Number) 三个；多一个少一个都会报\n   \"Not all output parameters\
          \ are validated.\"；\n3. 顶层不能有 print / 读写文件 / 自执行；\n4. 只用标准库。\n\n输入变量：text（String，接过滤节点的\
          \ text）\n输出变量：sql（String，接插入行节点的 insert_sql）、text（String，给通知用）、count（Number，本批条数）\n\
          \n字段缺失时写 NULL；数据库里没有的字段（例如「链接」）自动丢弃。\n\"\"\"\n\nimport datetime\nimport\
          \ json\nimport re\n\n_COLUMNS = (\"来源系统\", \"活动名称\", \"活动时间\", \"活动地点\"\
          , \"组织机构\", \"联系人\",\n            \"联系电话\", \"志愿时长\", \"招募人数\", \"活动类型\"\
          , \"活动学时\", \"抓取时间\")\n\n_TEXT_KEYS = (\"text\", \"text1\", \"crawler_text\"\
          , \"filtered_text\", \"input_text\",\n              \"内容\", \"活动文本\")\n\n\
          _HEADER_RE = re.compile(r\"^共\\s*\\d+\\s*场活动\\s*[:：]?\\s*$\")\n_ENTRY_RE\
          \ = re.compile(r\"^(\\d+)\\s*[.、．)）]\\s*(.*)$\")\n_KV_RE = re.compile(r\"\
          ^([^:：]{1,12})\\s*[:：]\\s*(.*)$\")\n_NOTE_RE = re.compile(r\"(抓取失败|没有抓取到|未抓取到|没有符合|暂无|没有活动|本次没有)\"\
          )\n_BLANK_CHARS = (\"\\ufeff\", \"\\u200b\", \"\\u200c\", \"\\u200d\", \"\
          \\u3000\", \"\\xa0\")\n\nEMPTY_SQL = 'INSERT OR IGNORE INTO activities (\"\
          活动名称\") SELECT NULL WHERE 0;'\n\n# 表里 NOT NULL 的列：缺了就不能写，只能跳过（INSERT OR\
          \ IGNORE 也会整行丢弃）\n_REQUIRED = (\"来源系统\", \"活动名称\", \"活动时间\", \"抓取时间\")\n\
          \n\ndef _as_text(value):\n    if value is None:\n        return \"\"\n \
          \   if isinstance(value, str):\n        return value\n    try:\n       \
          \ return str(value)\n    except Exception:\n        return \"\"\n\n\ndef\
          \ _pick(kwargs, names):\n    for name in names:\n        if name in kwargs:\n\
          \            value = kwargs[name]\n            if value is not None and\
          \ value != \"\":\n                return value\n    return \"\"\n\n\ndef\
          \ _unwrap(raw):\n    \"\"\"模板里可能误传了整个 {\"text\": \"...\"}；能解就取里面的 text。\"\
          \"\"\n    text = _as_text(raw).strip()\n    if text.startswith(\"{\") and\
          \ '\"text\"' in text:\n        try:\n            parsed = json.loads(text)\n\
          \            if isinstance(parsed, dict) and isinstance(parsed.get(\"text\"\
          ), str):\n                return parsed[\"text\"]\n        except Exception:\n\
          \            pass\n    return text\n\n\ndef _clean(value):\n    text = _as_text(value)\n\
          \    for ch in _BLANK_CHARS:\n        text = text.replace(ch, \" \")\n \
          \   return re.sub(r\"\\s+\", \" \", text).strip()\n\n\ndef _parse_blocks(raw):\n\
          \    \"\"\"-> [[标题, {字段: 值}, ...], ...]\"\"\"\n    blocks = []\n    current\
          \ = None\n    for line in _unwrap(raw).splitlines():\n        if not line.strip():\n\
          \            continue\n        stripped = line.strip()\n        if _HEADER_RE.match(stripped):\n\
          \            continue\n        if line[0].isspace():\n            if current\
          \ is None:\n                continue\n            match = _KV_RE.match(stripped)\n\
          \            if match is not None:\n                key = _clean(match.group(1))\n\
          \                value = _clean(match.group(2))\n                if value:\n\
          \                    current[1][key] = value\n            continue\n   \
          \     entry = _ENTRY_RE.match(stripped)\n        if entry is not None:\n\
          \            current = [_clean(entry.group(2)), {}]\n        elif _NOTE_RE.search(stripped):\n\
          \            # \"本次没有抓取到…\" / \"抓取失败：…\" 之类的提示不是活动\n            current\
          \ = None\n            continue\n        else:\n            current = [_clean(stripped),\
          \ {}]\n        blocks.append(current)\n    return blocks\n\n\ndef _guess_system(fields,\
          \ title):\n    \"\"\"根据字段组合判断来源系统。\"\"\"\n    if fields.get(\"活动类型\") or\
          \ fields.get(\"活动学时\"):\n        return \"辅学系统\"\n    link = fields.get(\"\
          链接\", \"\")\n    if fields.get(\"组织机构\") or fields.get(\"志愿时长\") or \"zyfw\"\
          \ in link:\n        return \"志愿系统\"\n    return \"未知系统\"\n\n\ndef _grab_time():\n\
          \    \"\"\"抓取时间：Asia/Shanghai（UTC+8），用带时区对象计算，容器时区不影响。\"\"\"\n    now =\
          \ datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)))\n\
          \    return now.strftime(\"%Y-%m-%d %H:%M:%S\")\n\n\ndef _sql_literal(value):\n\
          \    if value is None or value == \"\":\n        return \"NULL\"\n    return\
          \ \"'\" + _as_text(value).replace(\"'\", \"''\") + \"'\"\n\n\ndef build_rows(raw_text,\
          \ grab_time=\"\"):\n    \"\"\"文本 -> ([{列: 值}], 跳过条数)。缺 NOT NULL 字段的条目只能跳过。\"\
          \"\"\n    grab_time = _clean(grab_time) or _grab_time()\n    rows = []\n\
          \    skipped = 0\n    seen = set()\n    blocks = _parse_blocks(raw_text)\n\
          \    # 过滤节点已经去过重，这里再按「来源系统+名称+时间」兜一次，防止同批重复\n    for title, fields in blocks:\n\
          \        name = _clean(title)\n        if not name:\n            continue\n\
          \        row = {column: None for column in _COLUMNS}\n        row[\"来源系统\"\
          ] = _guess_system(fields, name)\n        row[\"活动名称\"] = name\n        for\
          \ column in (\"活动时间\", \"活动地点\", \"组织机构\", \"联系人\", \"联系电话\",\n        \
          \               \"志愿时长\", \"招募人数\", \"活动类型\", \"活动学时\"):\n            row[column]\
          \ = fields.get(column) or None\n        row[\"抓取时间\"] = grab_time\n    \
          \    # 活动时间 / 活动名称 等都是 NOT NULL，缺了就写不进去\n        if any(not row.get(column)\
          \ for column in _REQUIRED):\n            skipped += 1\n            continue\n\
          \        key = (row[\"来源系统\"], row[\"活动名称\"], row[\"活动时间\"])\n        if\
          \ key in seen:\n            continue\n        seen.add(key)\n        rows.append(row)\n\
          \    return rows, skipped\n\n\ndef build_sql(rows):\n    \"\"\"-> 一条 INSERT\
          \ OR IGNORE 语句；rows 为空时返回空操作语句。\"\"\"\n    if not rows:\n        return\
          \ EMPTY_SQL\n    column_sql = \", \".join('\"%s\"' % column for column in\
          \ _COLUMNS)\n    value_sql = \",\\n\".join(\n        \"(\" + \", \".join(_sql_literal(row.get(column))\
          \ for column in _COLUMNS) + \")\"\n        for row in rows\n    )\n    return\
          \ 'INSERT OR IGNORE INTO activities (%s) VALUES\\n%s;' % (column_sql, value_sql)\n\
          \n\ndef build_summary(rows, skipped=0):\n    total = len(rows)\n    if total\
          \ == 0:\n        base = \"共 0 条待写入：数据库里都已有，无需插入。\"\n    else:\n        counter\
          \ = {}\n        for row in rows:\n            system = row[\"来源系统\"]\n \
          \           counter[system] = counter.get(system, 0) + 1\n        detail\
          \ = \" / \".join(\"%s %d 条\" % (key, value) for key, value in counter.items())\n\
          \        base = \"共 %d 条待写入（%s）。\" % (total, detail)\n    if skipped:\n\
          \        base += \"另有 %d 条缺少「活动时间」等必填字段，已跳过。\" % skipped\n    return base\n\
          \n\ndef main(**kwargs):\n    \"\"\"Dify 代码节点入口。\"\"\"\n    text = \"\"\n\
          \    sql = EMPTY_SQL\n    count = 0\n    try:\n        kwargs = kwargs or\
          \ {}\n        text = _as_text(_pick(kwargs, _TEXT_KEYS))\n        rows,\
          \ skipped = build_rows(text, _pick(kwargs, (\"grab_time\", \"now_time\"\
          , \"当前时间\")))\n        sql = build_sql(rows)\n        count = len(rows)\n\
          \        summary = build_summary(rows, skipped)\n    except Exception as\
          \ err:  # 任何异常都不让工作流挂掉\n        sql = EMPTY_SQL\n        count = 0\n   \
          \     summary = \"生成插入 SQL 失败：%s: %s\" % (type(err).__name__, err)\n   \
          \ return {\"sql\": sql, \"text\": summary, \"count\": count}\n"
        code_language: python3
